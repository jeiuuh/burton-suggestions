<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Burton 积分榜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  body { min-height:100vh; background:linear-gradient(180deg,#fdfdfd 0%,#fffbe8 100%); color:#2b2b3a; }
  .lang-switch {
    position:absolute; top:22px; right:26px;
    background:#fff; border:1.5px solid #f0e0b0; border-radius:999px;
    padding:6px 16px; font-size:13px; font-weight:600; color:#a67c00;
    cursor:pointer; box-shadow:0 2px 8px rgba(170,130,20,0.08);
  }
  .lang-switch:hover { background:#fff3cf; }
  .header { text-align:center; padding:56px 20px 24px; position:relative; }
  .badge {
    display:inline-block; background:#fff6d9; color:#a67c00;
    padding:6px 18px; border-radius:999px; font-size:13px;
    font-weight:600; letter-spacing:1px; margin-bottom:14px;
  }
  .header h1 { font-size:36px; margin-bottom:8px; }
  .header h1 span { color:#e6a700; }
  .header p { color:#7a7a8c; font-size:15px; }
  .total-card {
    max-width:640px; margin:24px auto 0; padding:0 20px;
  }
  .total-card .inner {
    background:#fff; border:1px solid #f0e6c8; border-radius:18px;
    padding:24px; text-align:center; box-shadow:0 6px 20px rgba(170,130,20,0.07);
  }
  .total-card .num { font-size:44px; font-weight:800; color:#e6a700; }
  .total-card .lbl { font-size:13px; color:#8a8a9c; margin-top:4px; }
  .wrap {
    max-width:960px; margin:26px auto 60px; padding:0 20px;
    display:grid; grid-template-columns:1fr; gap:20px;
  }
  @media (max-width:820px){ .wrap{ grid-template-columns:1fr; } }
  .panel {
    max-width:720px; margin-left:auto; margin-right:auto; width:100%;
    background:#fff; border:1px solid #f0e6c8; border-radius:18px;
    padding:24px; box-shadow:0 4px 14px rgba(170,130,20,0.06);
  }
  .panel h2 { font-size:18px; margin-bottom:16px; }
  label { display:block; font-size:13.5px; font-weight:600; margin:14px 0 6px; color:#3a3a4a; }
  input, select {
    width:100%; padding:11px 13px; border:1.5px solid #f0e0b0; border-radius:10px;
    font-size:14px; background:#fafbfe; transition:border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus { outline:none; border-color:#f5b301; box-shadow:0 0 0 3px rgba(240,165,0,0.18); }
  .pts-row { display:flex; gap:8px; flex-wrap:wrap; }
  .pts-btn {
    flex:1; min-width:56px; padding:10px 0; border:1.5px solid #f0e0b0; border-radius:10px;
    background:#fafbfe; font-size:15px; font-weight:700; color:#3b6fd4; cursor:pointer;
    transition:all .15s;
  }
  .pts-btn.sel { background:#f5b301; color:#4a3800; border-color:#f5b301; }
  button.main {
    width:100%; margin-top:20px; padding:13px; border:none; border-radius:12px;
    background:#f5b301; color:#4a3800; font-size:15.5px; font-weight:600; cursor:pointer;
    transition:background .2s, transform .1s;
  }
  button.main:hover { background:#d99e00; }
  button.main:active { transform:scale(0.98); }
  button.main:disabled { background:#b9c8e8; cursor:not-allowed; }
  .me-line { font-size:13.5px; color:#7a7a8c; margin-top:14px; line-height:1.6; }
  .me-line b { color:#a67c00; }
  .lb-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .lb-head h2 { margin-bottom:0; }
  .refresh {
    background:#fff3cf; color:#a67c00; border:none; border-radius:9px;
    padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .refresh:hover { background:#ffe9ad; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:#9a9aac; font-size:12.5px; font-weight:600; padding:8px 6px; border-bottom:1.5px solid #eef1f8; }
  td { padding:11px 6px; border-bottom:1px solid #f2f4fa; vertical-align:middle; }
  tr.me td { background:#f4f8ff; }
  .rank { font-weight:800; color:#9a9aac; width:34px; }
  tr:nth-child(1) .rank { color:#e6a700; }
  tr:nth-child(2) .rank { color:#9aa5b5; }
  tr:nth-child(3) .rank { color:#c07a3a; }
  .bar-wrap { background:#faf3dd; border-radius:999px; height:8px; margin-top:6px; overflow:hidden; }
  .bar { height:100%; background:linear-gradient(90deg,#ffd76e,#f0a500); border-radius:999px; }
  .pct { font-size:12.5px; color:#8a8a9c; white-space:nowrap; }
  .log { margin-top:18px; border-top:1.5px solid #eef1f8; padding-top:14px; }
  .log h3 { font-size:14px; color:#5a5a6c; margin-bottom:10px; }
  .log-item { font-size:12.5px; color:#8a8a9c; padding:5px 0; border-bottom:1px dashed #f0f2f8; }
  .empty { text-align:center; color:#b0b0c0; font-size:13.5px; padding:30px 0; }
  .toast {
    display:none; position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    background:#f5b301; color:#4a3800; padding:12px 26px; border-radius:999px;
    font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,0.2); z-index:99;
  }
  .toast.err { background:#e05a5a; }
  footer { text-align:center; padding:18px; color:#a8a8ba; font-size:12.5px; }
  .admin-fab {
    position:fixed; bottom:22px; right:22px;
    background:#fff; border:1.5px solid #f0e0b0; border-radius:999px;
    padding:10px 18px; font-size:13.5px; font-weight:600; color:#a67c00;
    cursor:pointer; box-shadow:0 4px 14px rgba(170,130,20,0.15); z-index:50;
  }
  .admin-fab:hover { background:#fff3cf; }
  .admin-mask { display:none; position:fixed; inset:0; background:rgba(40,50,80,0.35); z-index:55; }
  .admin-modal {
    display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(92vw,420px); max-height:88vh; overflow-y:auto;
    background:#fff; border-radius:18px; padding:26px;
    box-shadow:0 12px 40px rgba(30,50,100,0.25); z-index:60; border:1px solid #f0e6c8;
  }
  .admin-modal h2 { font-size:18px; margin-bottom:14px; }
  .danger { background:#e05a5a !important; }
  .danger:hover { background:#c94a4a !important; }
</style>
</head>
<body>

  <button class="lang-switch" id="langBtn" onclick="toggleLang()">🌐 English</button>

  <div class="header">
    <div class="badge">HOUSE BURTON · POINTS</div>
    <h1>House Burton <span data-i18n="t_title">积分榜</span></h1>
    <p data-i18n="t_sub">每个人的加分，都属于整个 House 的荣誉 ✨</p>
  </div>

  <div class="total-card">
    <div class="inner">
      <div class="num" id="totalPts">0</div>
      <div class="lbl" data-i18n="t_total">House Burton 总积分</div>
    </div>
  </div>

  <div class="wrap">
    <div>
      <div class="panel">
        <h2>👤 <span data-i18n="t_who">你是谁？</span></h2>
        <label data-i18n="t_name">输入你的名字</label>
        <input type="text" id="myName" maxlength="20" data-i18n-ph="ph_name" placeholder="例如：Austin">
        <button class="main" style="margin-top:14px;" onclick="saveMe()" data-i18n="t_save">保存</button>
        <div class="me-line" id="meLine"></div>
      </div>


    </div>

    <div>
      <div class="panel">
        <div class="lb-head">
          <h2>🏆 <span data-i18n="t_lb">积分排行</span></h2>
          <button class="refresh" onclick="init()" data-i18n="t_refresh">🔄 刷新</button>
        </div>
        <div id="lbBox"><div class="empty" data-i18n="t_loading">加载中…</div></div>
      </div>
      <div class="panel log" id="logPanel" style="display:none;">
        <h3 data-i18n="t_log">最近加分记录</h3>
        <div id="logBox"></div>
      </div>
    </div>
  </div>

  <button class="admin-fab" id="adminFab" onclick="openAdmin()">🔐 Admin</button>
  <div class="admin-mask" id="adminMask" onclick="closeAdmin()"></div>
  <div class="admin-modal" id="adminModal">
    <h2>🔐 管理员后台 / Admin Panel</h2>
    <div id="adminLock">
      <label>密码 / Password</label>
      <input type="password" id="adminPwd" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')adminUnlock()">
      <button class="main" onclick="adminUnlock()">解锁 / Unlock</button>
      <div class="me-line" id="adminErr" style="color:#e05a5a;"></div>
    </div>
    <div id="adminPanel" style="display:none;">
      <label>同学名字 / Student name</label>
      <input type="text" id="admName" maxlength="20">
      <label>操作 / Action</label>
      <select id="admOp">
        <option value="1">➕ 加分 / Add</option>
        <option value="-1">➖ 减分 / Subtract</option>
      </select>
      <label>分数 / Points（任意数字）</label>
      <input type="number" id="admPts" value="5" min="1" max="9999">
      <label>原因 / Reason（选填）</label>
      <input type="text" id="admReason" maxlength="60">
      <button class="main" onclick="adminAdd()" id="admAddBtn">加分 / Add Points ✈️</button>
      <button class="main danger" style="margin-top:12px;" onclick="adminClear()" id="admClearBtn">🗑️ 清零所有积分 / Clear ALL Points</button>
      <button class="main" style="margin-top:12px; background:#8a93a8;" onclick="adminLockAgain()">🔒 锁定 / Lock</button>
    </div>
  </div>

  <footer>Made with 💙 for House Burton</footer>
  <div class="toast" id="toast"></div>

<script>
const BIN_ID = "6aad68d3ac6210605add1789";
const MASTER_KEY = "$2a$10$jCskws0au/GHMZY08gwh4uufJWSa7jSiYSiFFu.9vSo6Zu427jQw.";
const BIN_URL = "https://api.jsonbin.io/v3/b/" + BIN_ID;

const T = {
  zh: {
    t_title:"积分榜", t_sub:"每个人的加分，都属于整个 House 的荣誉 ✨",
    t_total:"House Burton 总积分", t_who:"你是谁？", t_name:"输入你的名字",
    ph_name:"例如：Austin", t_save:"保存",
    me_saved:"当前身份：", me_not:"还没设置名字，加分前请先保存你的名字～",
    t_add:"给同学加分", t_to:"给哪位同学加分", ph_to:"同学的名字",
    t_pts:"加多少分", t_reason:"原因（选填）", ph_reason:"例如：帮大家打扫了公共房间",
    t_send:"提交加分 ✈️", t_lb:"积分排行", t_refresh:"🔄 刷新", t_loading:"加载中…",
    t_log:"最近加分记录", t_empty:"还没有积分，快来做第一个加分的人！",
    t_col_name:"名字", t_col_pts:"积分", t_col_pct:"占比",
    ok_saved:"✅ 名字已保存！", ok_add:"✅ 加分成功！",
    err_load:"加载失败，请点刷新重试", err_add:"提交失败，请再试一次",
    err_noname:"请先保存你的名字", err_noname2:"请输入要加分的同学名字",
    err_num:"分数必须是 1-100 的数字",
    log_fmt:(l)=>`${l.to} +${l.pts} 分 · ${l.reason||"无原因"} · by ${l.by||"匿名"}`
  },
  en: {
    t_title:"Leaderboard", t_sub:"Every point you earn is honour for the whole House ✨",
    t_total:"Total House Burton Points", t_who:"Who are you?", t_name:"Enter your name",
    ph_name:"e.g. Austin", t_save:"Save",
    me_saved:"Current identity: ", me_not:"No name yet — save your name before adding points!",
    t_add:"Give Points", t_to:"Who are you giving points to", ph_to:"Classmate's name",
    t_pts:"How many points", t_reason:"Reason (optional)", ph_reason:"e.g. cleaned the common room",
    t_send:"Submit Points ✈️", t_lb:"Leaderboard", t_refresh:"🔄 Refresh", t_loading:"Loading…",
    t_log:"Recent Activity", t_empty:"No points yet — be the first to add some!",
    t_col_name:"Name", t_col_pts:"Points", t_col_pct:"Share",
    ok_saved:"✅ Name saved!", ok_add:"✅ Points added!",
    err_load:"Failed to load, please refresh", err_add:"Submit failed, please try again",
    err_noname:"Please save your name first", err_noname2:"Please enter the classmate's name",
    err_num:"Points must be a number from 1-100",
    log_fmt:(l)=>`${l.to} +${l.pts} pts · ${l.reason||"no reason"} · by ${l.by||"anonymous"}`
  }
};
let LANG = localStorage.getItem('hb_lang') || 'zh';

let scores = {};
let log = [];

function t(k){ return T[LANG][k]; }

function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if (typeof T[LANG][k] === 'string') el.textContent = T[LANG][k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const k = el.getAttribute('data-i18n-ph');
    el.placeholder = T[LANG][k] || '';
  });
  document.getElementById('langBtn').textContent = LANG === 'zh' ? '🌐 English' : '🌐 中文';
  render();
}

function toggleLang(){
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('hb_lang', LANG);
  applyLang();
}

function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isErr ? ' err' : '');
  el.style.display = 'block';
  setTimeout(()=> el.style.display = 'none', 3000);
}

function getMe(){ return localStorage.getItem('hb_myname') || ''; }

function saveMe(){
  const v = document.getElementById('myName').value.trim();
  if(!v){ toast(t('err_noname2'), true); return; }
  localStorage.setItem('hb_myname', v);
  toast(t('ok_saved'));
  render();
}

async function loadData(){
  const r = await fetch(BIN_URL, { headers: { 'X-Master-Key': MASTER_KEY, 'X-Bin-Meta': 'false' } });
  if(!r.ok) throw new Error('load');
  const d = await r.json();
  scores = (d && d.scores) || {};
  log = (d && d.log) || [];
}

async function pushData(){
  const r = await fetch(BIN_URL, {
    method: 'PUT',
    headers: { 'Content-Type':'application/json', 'X-Master-Key': MASTER_KEY, 'X-Bin-Versioning':'false' },
    body: JSON.stringify({ scores, log })
  });
  if(!r.ok) throw new Error('push');
}

function render(){
  const me = getMe();
  document.getElementById('myName').value = me;
  document.getElementById('meLine').innerHTML = me
    ? t('me_saved') + '<b>' + escapeHtml(me) + '</b>' + (scores[me] !== undefined ? ' · ' + scores[me] + ' pts' : '')
    : t('me_not');

  const entries = Object.entries(scores).sort((a,b)=> b[1]-a[1]);
  const total = entries.reduce((s,e)=> s+e[1], 0);
  document.getElementById('totalPts').textContent = total;

  const box = document.getElementById('lbBox');
  if(entries.length === 0){
    box.innerHTML = '<div class="empty">' + t('t_empty') + '</div>';
  } else {
    let rows = '';
    entries.forEach(([name, pts])=>{
      const pct = total > 0 ? (pts/total*100) : 0;
      const isMe = name === me ? ' class="me"' : '';
      rows += '<tr'+isMe+'><td class="rank"></td>' +
        '<td><b>'+escapeHtml(name)+'</b><div class="bar-wrap"><div class="bar" style="width:'+Math.max(pct,2)+'%"></div></div></td>' +
        '<td style="font-weight:700">'+pts+'</td>' +
        '<td class="pct">'+pct.toFixed(1)+'%</td></tr>';
    });
    box.innerHTML = '<table><tr><th>#</th><th>'+t('t_col_name')+'</th><th>'+t('t_col_pts')+'</th><th>'+t('t_col_pct')+'</th></tr>'+rows+'</table>';
    box.querySelectorAll('.rank').forEach((el,i)=> el.textContent = i+1);
  }

  const lp = document.getElementById('logPanel');
  if(log.length > 0){
    lp.style.display = 'block';
    document.getElementById('logBox').innerHTML = log.slice(0,8).map(l=>'<div class="log-item">'+escapeHtml(T[LANG].log_fmt(l))+'</div>').join('');
  } else {
    lp.style.display = 'none';
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function init(){
  document.getElementById('lbBox').innerHTML = '<div class="empty">' + t('t_loading') + '</div>';
  try{
    await loadData();
  }catch(e){
    document.getElementById('lbBox').innerHTML = '<div class="empty">' + t('err_load') + '</div>';
  }
  render();
}

const ADMIN_PWD = 'houseburtonisthegoat';

function openAdmin(){
  document.getElementById('adminMask').style.display = 'block';
  document.getElementById('adminModal').style.display = 'block';
  if(sessionStorage.getItem('hb_admin') === '1'){ showAdminPanel(); }
}
function closeAdmin(){
  document.getElementById('adminMask').style.display = 'none';
  document.getElementById('adminModal').style.display = 'none';
}
function showAdminPanel(){
  document.getElementById('adminLock').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
}
function adminUnlock(){
  if(document.getElementById('adminPwd').value === ADMIN_PWD){
    sessionStorage.setItem('hb_admin','1');
    document.getElementById('adminErr').textContent = '';
    document.getElementById('adminPwd').value = '';
    showAdminPanel();
  } else {
    document.getElementById('adminErr').textContent = '❌ 密码错误 / Wrong password';
  }
}
function adminLockAgain(){
  sessionStorage.removeItem('hb_admin');
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('adminLock').style.display = 'block';
}
async function adminAdd(){
  const to = document.getElementById('admName').value.trim();
  const pts = parseInt(document.getElementById('admPts').value);
  if(!to){ toast(t('err_noname2'), true); return; }
  if(!pts || pts < 1 || pts > 9999){ toast(t('err_num'), true); return; }
  const op = parseInt(document.getElementById('admOp').value) || 1;
  const delta = pts * op;
  const btn = document.getElementById('admAddBtn');
  btn.disabled = true;
  try{
    await loadData();
    scores[to] = Math.max(0, (scores[to] || 0) + delta);
    const reason = document.getElementById('admReason').value.trim();
    log.unshift({ to, pts: delta, reason, by: 'ADMIN', time: Date.now() });
    log = log.slice(0, 20);
    await pushData();
    toast(t('ok_add'));
    document.getElementById('admName').value = '';
    document.getElementById('admReason').value = '';
    render();
  }catch(e){ toast(t('err_add'), true); }
  btn.disabled = false;
}
async function adminClear(){
  const c1 = confirm(LANG === 'zh' ? '确定要清零所有积分吗？此操作不可恢复！' : 'Clear ALL points? This cannot be undone!');
  if(!c1) return;
  const c2 = confirm(LANG === 'zh' ? '再确认一次：真的要清空所有人的积分吗？' : 'Confirm again: really clear EVERYONE\'s points?');
  if(!c2) return;
  const btn = document.getElementById('admClearBtn');
  btn.disabled = true;
  try{
    scores = {};
    log.unshift({ to: 'ALL', pts: 0, reason: LANG === 'zh' ? '管理员清零了所有积分' : 'Admin cleared all points', by: 'ADMIN', time: Date.now() });
    await pushData();
    toast(LANG === 'zh' ? '🗑️ 已清零所有积分' : '🗑️ All points cleared');
    render();
  }catch(e){ toast(t('err_add'), true); }
  btn.disabled = false;
}

applyLang();
init();
</script>
</body>
</html>
